name: Update Project status after PR merge

# Runs when
#   * a pull request is MERGED into a supported release branch, or
#   * commits are PUSHED to a supported release branch (e.g. a cherry-pick pushed straight
#     onto the release branch from SourceTree / git, where no pull request exists), or
#   * on a schedule / manually (fallback, see below).
# A pull request that is closed without merging does nothing.
#
# WHY THE FALLBACK: GitHub runs the workflow file found ON THE BRANCH that was pushed to.
# A release branch that does not contain this file (e.g. created before it was added)
# never triggers the push/pull_request runs. Scheduled and manual runs always use the
# default branch, so every ~15 min they look at recent pushes to ALL release branches
# (GitHub events API) and process them, whether or not the branch has this file.
# Reprocessing is harmless: only issues still "In development" are ever changed.
on:
  pull_request:
    types: [closed]
    branches:
      # Branch format: release-<Name>-YY.S  (YY = year, S = sprint number 1-99),
      # e.g. release-Raptor-26.1, release-RaptorService-26.12.
      # Matching is by pattern, so every future sprint branch is covered automatically.
      # Globs are anchored to the full branch name and "release-Raptor-" must be followed
      # by a digit, so these can never match release-RaptorService-*.
      # (GitHub globs have no {1,2}, hence one pattern per sprint-digit count.)
      - 'release-Raptor-[0-9][0-9].[0-9]'
      - 'release-Raptor-[0-9][0-9].[0-9][0-9]'
      - 'release-RaptorService-[0-9][0-9].[0-9]'
      - 'release-RaptorService-[0-9][0-9].[0-9][0-9]'
  push:
    branches:
      # Same patterns as above (YAML anchors are avoided for compatibility).
      - 'release-Raptor-[0-9][0-9].[0-9]'
      - 'release-Raptor-[0-9][0-9].[0-9][0-9]'
      - 'release-RaptorService-[0-9][0-9].[0-9]'
      - 'release-RaptorService-[0-9][0-9].[0-9][0-9]'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: 'Process pushes to release branches made in the last N minutes'
        required: false
        default: '60'

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides WHAT to process: the merged PR's base branch, the pushed branch, or (schedule /
  # manual run) every release branch that received a push in the lookback window.
  discover:
    name: Find release branches to process
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MERGED: ${{ github.event.pull_request.merged }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          LOOKBACK_MIN: ${{ github.event.inputs.lookback_minutes || '60' }}
        run: |
          set +e
          set -uo pipefail

          BRANCH_RX='^release-(Raptor|RaptorService)-[0-9]{2}\.[0-9]{1,2}$'
          MATRIX='[]'

          case "$EVENT_NAME" in
            pull_request)
              if [ "$MERGED" = true ] && [[ "$BASE_REF" =~ $BRANCH_RX ]]; then
                MATRIX=$(jq -nc --arg b "$BASE_REF" '[{branch:$b, event:"pull_request", before:"", after:""}]')
              else
                echo "Pull request was not merged into a release branch. Nothing to do."
              fi ;;
            push)
              MATRIX=$(jq -nc --arg b "$REF_NAME" --arg x "$BEFORE_SHA" --arg y "$AFTER_SHA" \
                         '[{branch:$b, event:"push", before:$x, after:$y}]') ;;
            *)
              since=$(date -u -d "-${LOOKBACK_MIN} minutes" +%Y-%m-%dT%H:%M:%SZ)
              echo "Scanning pushes to release branches since $since..."
              EVENTS=$(gh api --paginate "repos/${REPO}/events?per_page=100" \
                         --jq '.[] | select(.type=="PushEvent")
                               | {ref: .payload.ref, before: .payload.before, after: .payload.head, at: .created_at}')
              MATRIX=$(jq -sc --arg since "$since" \
                         --arg rx '^refs/heads/release-(Raptor|RaptorService)-[0-9]{2}\.[0-9]{1,2}$' \
                         '[.[] | select(.at >= $since) | select(.ref | test($rx))
                           | {branch: (.ref | sub("^refs/heads/"; "")), event: "push", before, after}] | unique' \
                         <<<"$EVENTS")
              [ -n "$MATRIX" ] || MATRIX='[]' ;;
          esac

          COUNT=$(jq length <<<"$MATRIX")
          echo "Branches/pushes to process: $COUNT"
          jq -r '.[] | "  \(.branch)  \(.event)  \(.before[0:10])..\(.after[0:10])"' <<<"$MATRIX"
          { echo "matrix=$MATRIX"; echo "count=$COUNT"; } >> "$GITHUB_OUTPUT"

  update-project-issues:
    name: Move In development -> Ready for next beta (${{ matrix.branch }})
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      # ------------------------------------------------------------------
      # 1. Select the Project from the PR's target branch (strict regexes).
      # ------------------------------------------------------------------
      - name: Select Project from target branch
        env:
          BASE_REF: ${{ matrix.branch }}
        run: |
          set -euo pipefail

          if [[ "$BASE_REF" =~ ^release-Raptor-[0-9]{2}\.[0-9]{1,2}$ ]]; then
            echo "Selected Raptor test project."
            {
              echo "PROJECT_NAME=TEST - Raptor Automation"
              echo "PROJECT_NUMBER=11"
              echo "PROJECT_ID=PVT_kwHOECsPhs4BtFjj"
              echo "FIELD_ID=PVTSSF_lAHOECsPhs4BtFjjzhrQqEA"
              echo "OPT_IN_DEV=c39ef371"
              echo "OPT_READY=7765758d"
              echo "OPT_DONE=561b6537"
            } >> "$GITHUB_ENV"
          elif [[ "$BASE_REF" =~ ^release-RaptorService-[0-9]{2}\.[0-9]{1,2}$ ]]; then
            echo "Selected RaptorService test project."
            {
              echo "PROJECT_NAME=TEST - RaptorService Automation"
              echo "PROJECT_NUMBER=12"
              echo "PROJECT_ID=PVT_kwHOECsPhs4BtFjk"
              echo "FIELD_ID=PVTSSF_lAHOECsPhs4BtFjkzhrQqFA"
              echo "OPT_IN_DEV=965977d8"
              echo "OPT_READY=8d28a959"
              echo "OPT_DONE=7965d3be"
            } >> "$GITHUB_ENV"
          else
            echo "::error::Target branch '$BASE_REF' is not a supported release branch."
            exit 1
          fi

      # ------------------------------------------------------------------
      # 2. Extract #N references from the PR's commits and update items.
      # ------------------------------------------------------------------
      - name: Update Project items for referenced issues
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ matrix.event }}
          BEFORE_SHA: ${{ matrix.before }}
          AFTER_SHA: ${{ matrix.after }}
          PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ matrix.branch }}
        run: |
          # GitHub starts this shell as `bash -e`, so -e must be switched off explicitly:
          # one bad issue (or `read -d ''` returning 1 at EOF) must never abort the run.
          set +e
          set -uo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Repository secret PROJECTS_TOKEN is not set."
            exit 1
          fi

          # Hard safety guard: the original board (project 10) must never be touched.
          if [ "$PROJECT_NUMBER" = "10" ]; then
            echo "::error::Refusing to modify original Project #10."
            exit 1
          fi

          OWNER="${REPO%%/*}"
          NAME="${REPO##*/}"
          ERR_FILE="$(mktemp)"

          echo "Target project: $PROJECT_NAME (#$PROJECT_NUMBER)"
          echo "Event: $EVENT_NAME on $BASE_REF"

          # "#123" references: not glued to a word char, '&' (HTML entities) or '/' (URLs);
          # leading zeros dropped. Output is one number per line.
          extract_refs() {
            grep -oP '(?<![\w&/])#\K[0-9]{1,9}(?!\w)' | sed 's/^0*//' | grep -v '^$'
          }

          pr_commit_messages() {   # $1 = PR number (the API returns at most 250 commits)
            gh api --paginate "repos/${REPO}/pulls/$1/commits" --jq '.[].commit.message'
          }

          ref_kind() {             # $1 = number -> pr | issue | unknown
            local k
            if k=$(gh api "repos/${REPO}/issues/$1" \
                     --jq 'if .pull_request then "pr" else "issue" end' 2>/dev/null); then
              printf '%s' "$k"
            else
              printf 'unknown'
            fi
          }

          read -r -d '' PR_QUERY <<'GQL'
          query($owner: String!, $repo: String!, $number: Int!) {
            repository(owner: $owner, name: $repo) {
              pullRequest(number: $number) {
                title
                closingIssuesReferences(first: 50) { nodes { number } }
              }
            }
          }
          GQL

          # Issues linked to a source PR (e.g. the PR on main that was cherry-picked):
          # its title, its commit messages and its "closing" issue links.
          resolve_source_pr() {    # $1 = PR number -> issue numbers, one per line
            local resp
            resp=$(gh api graphql -f query="$PR_QUERY" -f owner="$OWNER" -f repo="$NAME" \
                     -F number="$1" 2>/dev/null)
            {
              jq -r '.data.repository.pullRequest.title // empty' <<<"$resp" 2>/dev/null
              pr_commit_messages "$1" 2>/dev/null
            } | extract_refs
            jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes[]?.number' \
              <<<"$resp" 2>/dev/null
          }

          if [ "$EVENT_NAME" = push ]; then
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo "Branch $BASE_REF was just created. No new commits to process."
              exit 0
            fi
            echo "Push to $BASE_REF: ${BEFORE_SHA:0:10}..${AFTER_SHA:0:10}"
            if ! MESSAGES=$(gh api --paginate "repos/${REPO}/compare/${BEFORE_SHA}...${AFTER_SHA}" \
                              --jq '.commits[].commit.message' 2>"$ERR_FILE"); then
              echo "::warning::Could not compare pushed commits (force push?): $(head -c 300 "$ERR_FILE"). Nothing processed."
              exit 0
            fi
          else
            echo "Merged pull request #$PR_NUMBER."
            if ! MESSAGES=$(pr_commit_messages "$PR_NUMBER" 2>"$ERR_FILE"); then
              echo "::error::Could not list commits of PR #$PR_NUMBER: $(cat "$ERR_FILE")"
              exit 1
            fi
          fi

          # Text of the PR being processed: its commits, title and description.
          CURRENT_TEXT=$(printf '%s\n%s\n%s\n' "$MESSAGES" "$PR_TITLE" "$PR_BODY")

          mapfile -t CANDIDATES < <(
            printf '%s\n' "$CURRENT_TEXT" | extract_refs | grep -vx "$PR_NUMBER" | sort -nu
          )

          # Cherry-picks: "(cherry picked from commit <sha>)" -> the PR(s) that sha belongs to.
          SOURCE_PRS=()
          for sha in $(printf '%s\n' "$CURRENT_TEXT" \
                         | grep -oP 'cherry picked from commit \K[0-9a-f]{7,40}' | sort -u); do
            for p in $(gh api "repos/${REPO}/commits/${sha}/pulls" --jq '.[].number' 2>/dev/null); do
              echo "Cherry-picked commit ${sha:0:10} belongs to pull request #$p."
              SOURCE_PRS+=("$p")
            done
          done

          # A "#N" that is a pull request (e.g. squash-merge "Title (#123)" copied from main)
          # is a cherry-pick source, not an issue.
          ISSUE_REFS=()
          for n in "${CANDIDATES[@]}"; do
            if [ "$(ref_kind "$n")" = pr ]; then
              echo "Reference #$n is a pull request (cherry-pick source). Resolving the issues it links."
              SOURCE_PRS+=("$n")
            else
              ISSUE_REFS+=("$n")
            fi
          done

          for p in $(printf '%s\n' "${SOURCE_PRS[@]:-}" | grep -v '^$' | grep -vx "$PR_NUMBER" | sort -nu); do
            echo "Resolving issues linked to source pull request #$p."
            for n in $(resolve_source_pr "$p" | grep -vx "$p" | grep -vx "$PR_NUMBER" | sort -nu); do
              if [ "$(ref_kind "$n")" = pr ]; then
                echo "  #$n is a pull request. Ignoring."
              else
                echo "  Found issue #$n."
                ISSUE_REFS+=("$n")
              fi
            done
          done

          mapfile -t ISSUES < <(printf '%s\n' "${ISSUE_REFS[@]:-}" | grep -v '^$' | sort -nu)

          if [ "${#ISSUES[@]}" -eq 0 ]; then
            echo "No GitHub issue references found in the commits of PR #$PR_NUMBER. Nothing to do."
            exit 0
          fi
          echo "Issue references found: ${ISSUES[*]/#/#}"

          read -r -d '' ISSUE_QUERY <<'GQL'
          query($owner: String!, $repo: String!, $number: Int!) {
            repository(owner: $owner, name: $repo) {
              issue(number: $number) {
                id
                number
                projectItems(first: 100, includeArchived: false) {
                  nodes {
                    id
                    project { id number }
                    fieldValueByName(name: "Automation Status") {
                      ... on ProjectV2ItemFieldSingleSelectValue { optionId name }
                    }
                  }
                }
              }
            }
          }
          GQL

          read -r -d '' UPDATE_MUTATION <<'GQL'
          mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
            updateProjectV2ItemFieldValue(input: {
              projectId: $project, itemId: $item, fieldId: $field,
              value: { singleSelectOptionId: $option }
            }) { projectV2Item { id } }
          }
          GQL

          UPDATED=0; SKIPPED=0; WARNED=0

          process_issue() {
            local n="$1" resp issue_id item item_id opt_id status_name

            echo "Processing GitHub issue #$n."

            # 1-2. Query by owner / repo / real issue number.
            resp=$(gh api graphql -f query="$ISSUE_QUERY" \
                     -f owner="$OWNER" -f repo="$NAME" -F number="$n" 2>"$ERR_FILE")
            issue_id=$(jq -r '.data.repository.issue.id // empty' <<<"$resp" 2>/dev/null)
            if [ -z "$issue_id" ]; then
              echo "::warning::Issue #$n does not exist or cannot be retrieved. Skipping. $(head -c 300 "$ERR_FILE")"
              WARNED=$((WARNED+1)); return
            fi

            # 3-4. Is the issue in the selected Project? (match by Project node ID)
            item=$(jq -c --arg pid "$PROJECT_ID" \
                     '[.data.repository.issue.projectItems.nodes[] | select(.project.id == $pid)] | first // empty' \
                     <<<"$resp")
            if [ -z "$item" ]; then
              echo "Issue #$n is not part of project '$PROJECT_NAME'. Skipping."
              SKIPPED=$((SKIPPED+1)); return
            fi

            # 5. Current Automation Status.
            item_id=$(jq -r '.id' <<<"$item")
            opt_id=$(jq -r '.fieldValueByName.optionId // empty' <<<"$item")
            status_name=$(jq -r '.fieldValueByName.name // "(not set)"' <<<"$item")
            echo "Issue #$n current Automation Status: $status_name"

            # 6-9. Only 'In development' is eligible.
            if [ "$opt_id" = "$OPT_READY" ]; then
              echo "Issue #$n is already 'Ready for next beta'. Skipping."
              SKIPPED=$((SKIPPED+1)); return
            elif [ "$opt_id" = "$OPT_DONE" ]; then
              echo "Issue #$n is 'Done'. Skipping."
              SKIPPED=$((SKIPPED+1)); return
            elif [ "$opt_id" != "$OPT_IN_DEV" ]; then
              echo "Issue #$n has status '$status_name' (not 'In development'). Skipping."
              SKIPPED=$((SKIPPED+1)); return
            fi

            # 6 / 10. Update; a failure only warns.
            if gh api graphql -f query="$UPDATE_MUTATION" \
                 -f project="$PROJECT_ID" -f item="$item_id" \
                 -f field="$FIELD_ID" -f option="$OPT_READY" >/dev/null 2>"$ERR_FILE"; then
              echo "Issue #$n updated: 'In development' -> 'Ready for next beta'."
              UPDATED=$((UPDATED+1))
            else
              echo "::warning::Could not update issue #$n: $(head -c 300 "$ERR_FILE")"
              WARNED=$((WARNED+1))
            fi
          }

          for n in "${ISSUES[@]}"; do
            echo "::group::Issue #$n"
            process_issue "$n"
            echo "::endgroup::"
          done

          echo "Done. Updated: $UPDATED, skipped: $SKIPPED, warnings: $WARNED."
          {
            echo "### Project status sync"
            echo "- Trigger: $EVENT_NAME on \`$BASE_REF\` (PR #$PR_NUMBER)"
            echo "- Project: $PROJECT_NAME (#$PROJECT_NUMBER)"
            echo "- Issues referenced: ${ISSUES[*]/#/#}"
            echo "- Updated: **$UPDATED** · Skipped: $SKIPPED · Warnings: $WARNED"
          } >> "$GITHUB_STEP_SUMMARY"

          exit 0